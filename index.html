      body {

      /* Custom Scrollbar Styles for Products Section */
      .custom-scrollbar {
        /* For Firefox */
        scrollbar-width: thin;
        scrollbar-color: #3b82f6 #e5e7eb; /* thumb and track color */
      }

      /* For WebKit browsers (Chrome, Safari, new Edge) */
      .custom-scrollbar::-webkit-scrollbar {
        height: 8px;
      }

      .custom-scrollbar::-webkit-scrollbar-track {
        background: #e5e7eb; /* light gray track */
        border-radius: 10px;
      }

      .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: #3b82f6; /* blue thumb */
        border-radius: 10px;
        border: 2px solid #e5e7eb; /* creates padding around thumb */
      }
      
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background-color: #2563eb; /* darker blue on hover */
      }
    </style>
